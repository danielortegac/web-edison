<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#24263c" stroke-width="1"/></pattern><radialGradient id="halo"><stop stop-color="#5352ac" stop-opacity=".5"/><stop offset="1" stop-color="#121420" stop-opacity="0"/></radialGradient><linearGradient id="cube" x2="1" y2="1"><stop stop-color="#e3e5ff"/><stop offset="1" stop-color="#7974d2"/></linearGradient></defs><style>
    .signal { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .signal {
        stroke-dasharray: .12 1;
        stroke-dashoffset: .14;
        animation: carry 1.28s cubic-bezier(.37,.11,.46,.92) both;
      }
      .outbound { animation-delay: 1.07s; }
      .core-face { animation: core-light .72s ease-out 1s both; }
      @keyframes carry {
        0% { stroke-dashoffset: .14; opacity: 0; }
        13% { opacity: 1; }
        78% { opacity: 1; }
        100% { stroke-dashoffset: -1.05; opacity: 0; }
      }
      @keyframes core-light {
        45% { fill: #edffe7; }
      }
    }
